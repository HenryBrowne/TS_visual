services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ts_bench
      POSTGRES_PASSWORD: ts_bench
      POSTGRES_DB: ts_bench
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_bench -d ts_bench"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
